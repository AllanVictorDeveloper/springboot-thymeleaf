  postgres:
    image: postgres:15
    container_name: thymeleaf-database
    environment:
      POSTGRES_DB: thymeleaf_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dev@llan73
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thymeleaf-net

volumes:
  postgres_data:

networks:
  thymeleaf-net:
    external: true
