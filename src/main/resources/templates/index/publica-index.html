<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/index/publica.index.css}" />
</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>
<div class="container home-container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card greeting-card">
                <h2 class="welcome-heading" th:text="${msnBemVindo}">
                    <i class="bi bi-stars me-2"></i> Bem-vindo!
                </h2>
                <p class="lead">
                    Este é o seu painel inicial. Utilize o menu de navegação para acessar as diversas
                    funcionalidades do sistema.
                </p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
