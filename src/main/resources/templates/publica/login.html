<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/publica/login.style.css}" />
</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>

<div class="container login-container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card login-card">
                <div class="card-header login-card-header">
                    <h3 class="mb-0">
                        <i class="bi bi-person-fill me-2"></i> Login
                    </h3>
                </div>
                <div class="card-body login-card-body">
                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show alert-custom" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label form-label-custom">
                                <i class="bi bi-person me-2"></i> Usuário:
                            </label>
                            <input type="text" class="form-control form-control-custom" id="username" name="username"
                                   placeholder="Digite seu nome de usuário" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label form-label-custom">
                                <i class="bi bi-key-fill me-2"></i> Senha:
                            </label>
                            <input type="password" class="form-control form-control-custom" id="password" name="password"
                                   placeholder="Digite sua senha" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-primary-custom">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
