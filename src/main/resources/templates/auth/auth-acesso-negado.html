<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso Negado</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-cuVtdP43u7F4Rf2c1A5tLgPj1tvEfi6Bb27Q0Vfq0Q3wFhBZnZ8Tb8CkceCp7J2w" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* Adicionando um fundo com gradiente */
    body {
      background: linear-gradient(135deg, #ff5f6d, #ffc3a0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
    }

    .container {
      background-color: #fff;
      padding: 40px 50px;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h3 {
      font-size: 2.5rem;
      color: #dc3545;
      margin-bottom: 20px;
    }

    .bi-lock {
      font-size: 4rem;
      margin-bottom: 20px;
      color: #dc3545;
    }

    p {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 30px;
    }

    /* Estilo do botão com animação */
    .btn-custom {
      background-color: #dc3545;
      border: none;
      color: white;
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s ease-in-out, background-color 0.3s;
    }

    .btn-custom:hover {
      background-color: #c82333;
      transform: scale(1.05);
    }

    .btn-custom:focus {
      outline: none;
    }

    /* Animação no carregamento */
    .container {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
<div class="container">
  <div class="bi-lock"></div>
  <h3>Acesso Negado</h3>
  <p>Você não tem permissão para acessar esta página. Se acredita que isso é um erro, entre em contato com o administrador.</p>
  <a href="/" class="btn btn-custom">Voltar para a página inicial</a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-OgVRvuATP1z7Jj6WmFoy6zS3p9H5YdL+n24lwqG8kZVZBv0qQ+4E6j7kcOYgIn1E" crossorigin="anonymous"></script>
</body>
</html>
