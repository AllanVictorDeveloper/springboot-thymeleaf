<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <style>
    .nav-profile-name {
        font-weight: bold;
    }

    .dropdown-menu {
        border: none;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        border-radius: 0.25rem;
    }

    .dropdown-item {
        padding: 0.75rem 1.5rem;
        display: flex;
        align-items: center;
    }

    .dropdown-item i {
        margin-right: 0.75rem;
    }

    .dropdown-divider {
        margin: 0.5rem 0;
    }
  </style>
</head>
<body>

<ul th:fragment="nav-profile" class="nav navbar-nav ms-auto">
  <li class="nav-item dropdown">
    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
      <i class="bi bi-person-circle me-2"></i>
      <span class="nav-profile-name" sec:authentication="principal.nomeCompleto"></span>
    </a>
    <div class="dropdown-menu dropdown-menu-end">
      <a class="dropdown-item" href="#">
        <i class="bi bi-person-fill-gear me-2"></i> Editar Perfil
      </a>
      <a class="dropdown-item" href="#">
        <i class="bi bi-key-fill me-2"></i> Alterar Senha
      </a>
      <div class="dropdown-divider"></div>
      <a class="dropdown-item" href="/logout">
        <i class="bi bi-box-arrow-right me-2"></i> Sair
      </a>
    </div>
  </li>
</ul>

</body>
</html>
