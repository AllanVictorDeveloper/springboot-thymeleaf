<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alterar Usuário</title>

    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>

    <style>
        .mensagem {
            font-size: 0.875em;
        }

        .is-invalid {
           border-color: red;
        }
    </style>
</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h2 class="mb-4">Alterar Usuário</h2>

            <form id="formUsuario" class="needs-validation"
                  th:action="@{/usuario/editar/{id}(id=${usuario.id})}"
                  th:object="${usuario}" method="post" novalidate>

                <!-- Nome -->
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input id="nome" type="text" th:field="*{nome}" class="form-control" required minlength="3" placeholder="Digite o nome">
                    <div class="invalid-feedback">
                        Informe um nome válido (mínimo 3 caracteres).
                    </div>
                </div>

                <!-- CPF -->
                <div class="mb-3">
                    <label for="cpf" class="form-label">CPF:</label>
                    <input id="cpf" type="text" th:field="*{cpf}" class="form-control" required maxlength="14" placeholder="Digite o CPF">
                    <div class="invalid-feedback">
                        Informe um CPF válido.
                    </div>
                </div>

                <!-- Data de Nascimento -->
                <div class="mb-3">
                    <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
                    <input id="dataNascimento" type="date" name="dataNascimento"
                           th:value="${#temporals.format(usuario.dataNascimento, 'yyyy-MM-dd')}"
                           class="form-control" required>
                    <div class="invalid-feedback">
                        Data inválida. Verifique se não é no futuro.
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" required placeholder="Digite o email">
                    <div class="invalid-feedback">
                        Informe um e-mail válido.
                    </div>
                </div>

                <!-- Login -->
                <div class="mb-3">
                    <label for="login" class="form-label">Login:</label>
                    <input id="login" type="text" th:field="*{login}" class="form-control" required minlength="4" placeholder="Digite o login">
                    <div class="invalid-feedback">
                        Informe um login válido (mínimo 4 caracteres).
                    </div>
                </div>

                <!-- Senha -->
                <div class="mb-4">
                    <label for="password" class="form-label">Senha:</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control" required minlength="6" placeholder="Digite a nova senha">
                    <div class="invalid-feedback">
                        Senha deve ter pelo menos 6 caracteres.
                    </div>
                </div>

                <!-- Botão -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>Alterar
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- Validação instantânea -->
<script>
    (function () {
        'use strict';

        var forms = document.querySelectorAll('.needs-validation');

        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!validateForm(form)) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);

                form.querySelectorAll('input').forEach(input => {
                    input.addEventListener('blur', () => validateField(input));
                });
            });

        function validateForm(form) {
            let valid = form.checkValidity();

            const cpfInput = form.querySelector('#cpf');
            const dateInput = form.querySelector('#dataNascimento');

            if (!isValidCPF(cpfInput.value)) {
                cpfInput.classList.add('is-invalid');
                valid = false;
            }

            if (!isValidDate(dateInput.value)) {
                dateInput.classList.add('is-invalid');
                valid = false;
            }

            return valid;
        }

        function validateField(input) {
            if (input.id === 'cpf' && input.value !== '') {
                if (!isValidCPF(input.value)) {
                    input.classList.add('is-invalid');
                    input.classList.remove('is-valid');
                } else {
                    input.classList.add('is-valid');
                    input.classList.remove('is-invalid');
                }
            } else if (input.id === 'dataNascimento' && input.value !== '') {
                if (!isValidDate(input.value)) {
                    input.classList.add('is-invalid');
                    input.classList.remove('is-valid');
                } else {
                    input.classList.add('is-valid');
                    input.classList.remove('is-invalid');
                }
            } else {
                if (input.checkValidity()) {
                    input.classList.add('is-valid');
                    input.classList.remove('is-invalid');
                } else {
                    input.classList.add('is-invalid');
                    input.classList.remove('is-valid');
                }
            }
        }

        // Validador de CPF real
        function isValidCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g,'');
            if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

            let soma = 0;
            for (let i = 0; i < 9; i++) {
                soma += parseInt(cpf.charAt(i)) * (10 - i);
            }
            let resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(9))) return false;

            soma = 0;
            for (let i = 0; i < 10; i++) {
                soma += parseInt(cpf.charAt(i)) * (11 - i);
            }
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            return resto === parseInt(cpf.charAt(10));
        }

        // Validador de Data
        function isValidDate(dateString) {
            if (!dateString) return false;
            const today = new Date();
            const inputDate = new Date(dateString);
            return inputDate <= today;
        }
    })();
</script>

</body>
</html>
