<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .user-list-container {
            margin-top: 2rem;
        }

        .user-list-card {
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }

        .user-list-card-header {
            background-color: #007bff;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem 0.5rem 0 0;
        }

        .user-list-card-body {
            padding: 1.5rem;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            border-radius: 0.2rem;
        }

        .action-buttons a {
            margin-right: 0.5rem;
        }

        .action-buttons a:last-child {
            margin-right: 0;
        }

        .status-active {
            color: #28a745;
            font-weight: bold;
        }

        .status-inactive {
            color: #dc3545;
            font-weight: bold;
        }

        .no-users {
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>

<div class="container user-list-container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card user-list-card">
                <div class="card-header user-list-card-header">
                    <h3 class="mb-0">
                        <i class="bi bi-people-fill me-2"></i> Gerenciar Usuários
                    </h3>
                </div>
                <div class="card-body user-list-card-body">
                    <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show alert-success-custom" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${mensagem}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered table-striped">
                            <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Nascimento</th>
                                <th>E-mail</th>
                                <th>Papéis</th>
                                <th>Status</th>
                                <th class="text-center">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${usuarios.empty}">
                                <td colspan="7" class="text-center no-users">Nenhum usuário cadastrado.</td>
                            </tr>
                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.nome}">Nome</td>
                                <td th:text="${usuario.cpf}">CPF</td>
                                <td th:text="${#temporals.format(usuario.dataNascimento, 'dd/MM/yyyy')}">Nascimento</td>
                                <td th:text="${usuario.email}">E-mail</td>
                                <td>
                                    <th:block th:each="pp : ${usuario.papeis}">
                                        <span class="badge bg-secondary" th:text="${pp.papel}">Papel</span>
                                    </th:block>
                                </td>
                                <td class="text-center">
                                    <span th:class="${usuario.ativo} ? 'status-active' : 'status-inactive'"
                                          th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'">Status</span>
                                </td>
                                <td class="text-center action-buttons">
                                    <a class="btn btn-outline-danger btn-sm"
                                       th:href="@{/usuario/admin/apagar/{id}(id=${usuario.id})}"
                                       th:data-confirm-delete="|Você gostaria de apagar ${usuario.nome}?|"
                                       onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false">
                                        <i class="bi bi-trash-fill"></i> Apagar
                                    </a>
                                    <a class="btn btn-outline-primary btn-sm"
                                       th:href="@{/usuario/editar/{id}(id=${usuario.id})}">
                                        <i class="bi bi-pencil-fill"></i> Editar
                                    </a>
                                    <a class="btn btn-outline-success btn-sm"
                                       th:href="@{/usuario/editarPapel/{id}(id=${usuario.id})}">
                                        <i class="bi bi-person-badge-fill"></i> Papéis
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
