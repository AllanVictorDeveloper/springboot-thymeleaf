<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>

    <!-- Link para o Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Script para o Bootstrap 5 JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>

<div class="container my-4">
    <div class="row">
        <div class="col">
            <h1 class="mb-4">Lista de Usuários</h1>

            <!-- Alerta de mensagem -->
            <div class="alert alert-success alert-dismissible fade show" th:if="${mensagem}">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                <span th:text="${mensagem}"></span>
            </div>

            <!-- Tabela de Usuários -->
            <table class="table table-bordered table-striped">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Nascimento</th>
                    <th>E-mail</th>
                    <th>Papeis</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- Mensagem quando não há usuários -->
                <tr th:if="${usuarios.empty}" class="text-center">
                    <td colspan="5">Sem usuários cadastrados</td>
                </tr>
                <!-- Listagem dos usuários -->
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.nome}">Nome</td>
                    <td th:text="${usuario.cpf}">CPF</td>
                    <td th:text="${#temporals.format(usuario.dataNascimento, 'dd/MM/yyyy')}">Nascimento</td>
                    <td th:text="${usuario.email}">E-mail</td>
                    <td >
                        <th:block th:each="pp : ${usuario.papeis}">
                            <span th:text="${pp.papel}">Papel</span><br/>
                        </th:block>
                    </td>
                    <td>
                        <!-- Botões de Ação -->
                        <div class="btn-group" role="group">
                            <a class="btn btn-outline-danger btn-sm"
                               th:href="@{/usuario/admin/apagar/{id}(id=${usuario.id})}"
                               th:data-confirm-delete="|Você gostaria de apagar ${usuario.nome}?|"
                               onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false">
                                Apagar
                            </a>
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/usuario/editar/{id}(id=${usuario.id})}">
                                Editar
                            </a>
                            <a class="btn btn-outline-success btn-sm"
                               th:href="@{/usuario/editarPapel/{id}(id=${usuario.id})}">
                                Papéis
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
