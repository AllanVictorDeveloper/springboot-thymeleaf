<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Papéis do Usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/auth/admin/admin.editar.papel.usuario.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>

<div class="container edit-roles-container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card edit-roles-card">
                <div class="card-header edit-roles-card-header">
                    <h3 class="mb-0">
                        <i class="bi bi-person-badge-fill me-2"></i> Gerenciar Papéis do Usuário
                    </h3>
                </div>
                <div class="card-body edit-roles-card-body">
                    <form th:action="@{/usuario/editarPapel/{id}(id=${usuario.id})}" th:object="${usuario}" method="post">

                        <h5 class="mb-3">Informações do Usuário</h5>

                        <div class="mb-3">
                            <label class="form-label form-label-custom">Nome:</label>
                            <input type="text" class="form-control-plaintext" th:field="*{nome}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-custom">CPF:</label>
                            <input type="text" class="form-control-plaintext" th:field="*{cpf}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-custom">Nascimento:</label>
                            <input type="text" class="form-control-plaintext" th:field="*{dataNascimento}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-custom">Email:</label>
                            <input type="text" class="form-control-plaintext" th:field="*{email}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-custom">Login:</label>
                            <input type="text" class="form-control-plaintext" th:field="*{login}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-custom">Status:</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input form-check-input-custom" type="radio" value="true"
                                           th:field="*{ativo}" id="ativoTrue">
                                    <label class="form-check-label" for="ativoTrue">Ativo</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input form-check-input-custom" type="radio" value="false"
                                           th:field="*{ativo}" id="ativoFalse">
                                    <label class="form-check-label" for="ativoFalse">Inativo</label>
                                </div>
                            </div>
                        </div>

                        <h5 class="mt-4 mb-3">Atribuir Papéis</h5>

                        <div th:each="pp : ${listaPapeis}" class="form-check form-check-custom">
                            <input class="form-check-input form-check-input-custom" type="checkbox" name="pps" th:value="${pp.id}"
                                   th:checked="${#lists.contains(usuario.papeis, pp)}" id="'papel_' + ${pp.id}">
                            <label class="form-check-label" th:for="'papel_' + ${pp.id}" th:text="${pp.papel}"></label>
                        </div>

                        <div th:if="${mensagem}" class="text-danger-custom mt-3" th:text="${mensagem}"></div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-warning btn-warning-custom">
                                <i class="bi bi-save-fill me-2"></i> Salvar Alterações
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
