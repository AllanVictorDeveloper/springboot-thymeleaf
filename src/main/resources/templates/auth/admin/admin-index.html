<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
        background-color: #f8f9fa;
    }

    .home-container {
        margin-top: 3rem;
    }

    .jumbotron-custom {
        background-color: #e9ecef;
        padding: 2rem;
        border-radius: 0.5rem;
    }

    .admin-greeting {
        color: #007bff;
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
    }

    .welcome-message {
        font-size: 1.2rem;
        color: #6c757d;
    }
  </style>
</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>

<div class="container home-container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="jumbotron jumbotron-custom">
        <h2 class="admin-greeting">
          <i class="bi bi-shield-fill-check me-2"></i> Olá Administrador
        </h2>
        <p class="welcome-message">
          Bem-vindo ao painel administrativo da biblioteca. Utilize o menu de navegação
          para gerenciar usuários e outras funcionalidades do sistema.
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
