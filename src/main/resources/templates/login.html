<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.2.3-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script th:src="@{/bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js}"></script>


    <style>
        .mensagem {
            color: red;
        }
    </style>
</head>
<body>
<div th:insert="~{fragments/publica-nav :: nav}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div th:if="${param.error}">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    <span th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}"></span>
                </div>
            </div>

            <h2 class="mb-4">Login</h2>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="col-sm-1 col-form-label">Usuário:</label>
                    <div class="col-sm-3">
                        <input class="form-control" type="text" name="username">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="col-sm-1 col-form-label">Senha:</label>
                    <div class="col-sm-3">
                        <input class="form-control" type="text" name="password">
                    </div>
                </div>
                <input class="btn btn-primary" type="submit" value="Entrar"/>
            </form>
        </div>
    </div>
</div>

</body>
